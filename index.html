<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BetterHoster</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #111111; color: #ededed; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .sidebar { width: 240px; height: 100%; min-height: 0; overflow: hidden; padding: 28px 16px; background: #161616; border-right: 1px solid #303030; }
    .section-label { margin: 0 12px 10px; color: #666666; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border: 0; border-radius: 6px; background: transparent; color: #888888; font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
    .item[hidden] { display: none; }
    .item:hover { background: #383838; }
    .item:focus-visible { outline: 2px solid #d5d5d5; outline-offset: -2px; }
    .item svg { width: 18px; height: 18px; flex: none; color: #bebebe; }
    body { display: flex; height: 100dvh; overflow: hidden; }
    .sidebar { flex: 0 0 240px; }
    .item[aria-current="page"] { background: #292929; color: #ededed; }
    main { min-height: 0; height: 100%; overflow-y: auto; overscroll-behavior: contain; padding: 28px; width: min(100%, 520px); }
    label { display: block; margin: 0 0 8px; font-size: 14px; color: #bebebe; }
    input, select { width: 100%; margin-bottom: 20px; padding: 11px 12px; border: 1px solid #303030; border-radius: 6px; background: #202020; color: #ededed; font: inherit; }
    .editions { display: flex; gap: 8px; margin-bottom: 20px; }
    .edition { padding: 10px 16px; border: 1px solid #303030; border-radius: 6px; background: #242424; color: #888888; font: inherit; cursor: pointer; }
    .edition[aria-pressed="true"] { color: #ededed; background: #383838; border-color: #d5d5d5; }
    .submit { padding: 11px 16px; border: 0; border-radius: 6px; background: #ededed; color: #111111; font: inherit; font-weight: 600; cursor: pointer; }
    dialog { width: min(360px, calc(100% - 48px)); padding: 24px; border: 1px solid #303030; border-radius: 8px; background: #1b1b1b; color: #ededed; }
    dialog::backdrop { background: rgba(0, 0, 0, .7); }
    dialog p { margin: 0 0 20px; }
    dialog[open] { animation: popup-in 180ms ease-out; }
    @keyframes popup-in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) { dialog[open] { animation: none; } }
    @keyframes page-enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    main { animation: page-enter 220ms ease-out both; }
    button, a, input, select { transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease; }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } button, a, input, select { transition: none; } }

    /* Motion for page changes and interaction feedback. */
    @keyframes motion-sidebar { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes motion-reveal { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes motion-dialog { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes motion-backdrop { from { opacity: 0; } to { opacity: 1; } }
    .sidebar { animation: motion-sidebar 380ms cubic-bezier(.2,.7,.2,1) both; }
    .sidebar .item, .sidebar .section-label, .sidebar-server { animation: motion-reveal 360ms cubic-bezier(.2,.7,.2,1) backwards; }
    .sidebar > :nth-child(2) { animation-delay: 35ms; }
    .sidebar > :nth-child(3) { animation-delay: 70ms; }
    .sidebar > :nth-child(4) { animation-delay: 105ms; }
    .sidebar > :nth-child(5) { animation-delay: 140ms; }
    .sidebar > :nth-child(6) { animation-delay: 175ms; }
    .sidebar > :nth-child(7) { animation-delay: 210ms; }
    .sidebar > :nth-child(8) { animation-delay: 245ms; }
    main { animation: motion-reveal 380ms cubic-bezier(.2,.7,.2,1) both; }
    button, a, input, select { transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease, box-shadow 200ms ease, transform 200ms cubic-bezier(.2,.7,.2,1), opacity 200ms ease; }
    button:not(:disabled):active { transform: scale(.96); }
    .sidebar .item:hover { transform: translateX(4px); }
    .sidebar .item svg { transition: transform 220ms cubic-bezier(.2,.7,.2,1), color 200ms ease; }
    .sidebar .item:hover svg { transform: scale(1.12); }
    input:focus, select:focus { box-shadow: 0 0 0 3px rgba(213,213,213,.12); }
    dialog[open] { animation: motion-dialog 300ms cubic-bezier(.2,.7,.2,1); }
    dialog[open]::backdrop { animation: motion-backdrop 300ms ease; }
    .panel:not([hidden]) { animation: motion-reveal 320ms cubic-bezier(.2,.7,.2,1); }
    .server-card, .create-server, .software-card, .modpack-card, .monitor-card, .detail-row { animation: motion-reveal 380ms cubic-bezier(.2,.7,.2,1) backwards; transition: transform 220ms cubic-bezier(.2,.7,.2,1), background-color 200ms ease, border-color 200ms ease, box-shadow 200ms ease; }
    .server-card:nth-child(2), .software-card:nth-child(2), .modpack-card:nth-child(2), .monitor-card:nth-child(2), .detail-row:nth-child(2) { animation-delay: 35ms; }
    .server-card:nth-child(3), .software-card:nth-child(3), .modpack-card:nth-child(3), .monitor-card:nth-child(3), .detail-row:nth-child(3) { animation-delay: 70ms; }
    .server-card:nth-child(4), .software-card:nth-child(4), .modpack-card:nth-child(4) { animation-delay: 105ms; }
    .server-card:hover, .create-server:hover, .software-card:hover, .modpack-card:hover { transform: translateY(-3px); border-color: #666666; }
    .create-server svg, .modpack-icon { transition: transform 240ms cubic-bezier(.2,.7,.2,1); }
    .create-server:hover svg { transform: rotate(90deg) scale(1.08); }
    .modpack-card:hover .modpack-icon { transform: scale(1.06); }
    .software-card::before, .server-card::before { transition: opacity 240ms ease, transform 350ms ease; }
    .software-card:hover::before, .server-card:hover::before { transform: scale(1.06); }
    .sidebar-server, .sidebar-server-status, .status, .overview-status, .card-status, .card-status::before { transition: background-color 260ms ease, border-color 260ms ease, color 260ms ease; }
    .version-list:not([hidden]) { animation: motion-reveal 180ms ease-out; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
    @media (max-height: 600px) {
      .sidebar { padding-top: 12px; padding-bottom: 12px; }
      .sidebar .item { padding-top: 6px; padding-bottom: 6px; }
      .section-label { margin-bottom: 4px; }
    }
    @media (max-width: 600px) {
      .sidebar { flex-basis: 78px; width: 78px; padding: 16px 6px; }
      .section-label { display: none; }
      .sidebar .item { flex-direction: column; justify-content: center; gap: 4px; padding: 9px 2px; font-size: 10px; text-align: center; }
      .sidebar .item:hover { transform: none; }
      main { flex: 1; min-width: 0; padding: 16px; }
      .editions { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <aside class="sidebar" aria-label="Server dashboard menu">
    <div class="section-label">Server</div>
    <button class="item" type="button" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Create</span></button>
    <button class="item" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 6 6-6 6M13 18h7"/></svg><span>Terminal</span></button>
    <button class="item" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Config</span></button>
  </aside>
  <main>
    <form id="create-form">
      <label for="name">Server name</label>
      <input id="name" name="name" required>
      <label>Edition</label>
      <div class="editions"><button class="edition" type="button" data-edition="java" aria-pressed="true">Java</button><button class="edition" type="button" data-edition="bedrock" aria-pressed="false">Bedrock</button></div>
      <label for="port">Port</label>
      <input id="port" name="port" type="number" min="1" max="65535" value="25565" required>
      <label for="memory">Memory (GB)</label>
      <input id="memory" name="memory" type="number" min="1" value="2" required>
      <label for="players">Maximum players</label>
      <input id="players" name="players" type="number" min="1" value="20" required>
      <button class="submit" type="submit">Create</button>
    </form>
  </main>
  <dialog id="eula-dialog" aria-labelledby="eula-heading">
    <h2 id="eula-heading">Minecraft EULA</h2>
    <p>To create a server, please read and accept the <a href="https://www.minecraft.net/eula" target="_blank" rel="noopener" style="color:#ededed">Minecraft EULA</a>.</p>
    <button class="submit" id="accept-eula" type="button">Accept</button>
    <button class="edition" id="cancel-eula" type="button">Cancel</button>
  </dialog>
  <dialog id="popup" aria-labelledby="popup-message"><p id="popup-message"></p><button class="submit" type="button" id="popup-close">OK</button></dialog>
  <script>
    const popup = document.getElementById('popup');
    let edition = 'java';
    const port = document.getElementById('port');
    document.querySelectorAll('.edition').forEach(button => button.addEventListener('click', () => {
      edition = button.dataset.edition;
      document.querySelectorAll('.edition').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      port.value = edition === 'java' ? '25565' : '19132';
    }));
    const form = document.getElementById('create-form');
    const eulaDialog = document.getElementById('eula-dialog');
    form.addEventListener('submit', event => { event.preventDefault(); eulaDialog.showModal(); });
    document.getElementById('cancel-eula').addEventListener('click', () => eulaDialog.close());
    document.getElementById('accept-eula').addEventListener('click', async () => {
      eulaDialog.close();
      const button = form.querySelector('.submit');
      button.disabled = true;
      try {
        const response = await fetch('/api/servers', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...Object.fromEntries(new FormData(form)), edition, eulaAccepted: true }) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message);
        window.location.href = '/';
      } catch (error) {
        document.getElementById('popup-message').textContent = error.message || 'Unable to create the server.';
        popup.showModal();
        button.disabled = false;
      }
    });
    document.getElementById('popup-close').addEventListener('click', () => popup.close());
  </script>
</body>
</html>
