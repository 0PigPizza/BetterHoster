name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-22.04
    env:
      COMPOSE_PROJECT_NAME: betterhoster-ci
      BETTERHOSTER_HTTP_PORT: '18080'
      BETTERHOSTER_JAVA_PORTS: '25665-25675'
      BETTERHOSTER_BEDROCK_PORTS: '19232-19242'
    steps:
      - uses: actions/checkout@v4
      - name: Enable user namespaces on the ephemeral runner
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build and start the Docker stack
        run: docker compose up --build -d --wait
      - name: Test dashboard and editor
        run: python3 scripts/smoke_docker.py
      - name: Package Docker image
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          docker save betterhoster:1.0 | gzip -1 > dist/BetterHoster-Docker.tar.gz
          cp compose.yaml schema.sql dist/
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: BetterHoster-Docker
          path: dist/*
          if-no-files-found: error
          compression-level: 0
      - name: Diagnose editor sandbox
        if: failure()
        run: docker compose exec -T --user betterhoster dashboard bwrap --unshare-pid --ro-bind /usr /usr --dir /proc --dev /dev -- /usr/bin/true
      - name: Stop test stack
        if: always()
        run: docker compose down --volumes --remove-orphans
