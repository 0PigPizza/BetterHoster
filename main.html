<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BetterHoster</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #111111; color: #ededed; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .sidebar { width: 240px; height: 100%; min-height: 0; overflow: hidden; padding: 28px 16px; background: #161616; border-right: 1px solid #303030; }
    .section-label { margin: 0 12px 10px; color: #666666; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border: 0; border-radius: 6px; background: transparent; color: #888888; font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
    .item:hover { background: #383838; }
    .item[aria-current="page"] { background: #292929; color: #ededed; }
    .item:focus-visible { outline: 2px solid #d5d5d5; outline-offset: -2px; }
    .item svg { width: 18px; height: 18px; flex: none; color: #bebebe; }
    body { display: flex; height: 100dvh; overflow: hidden; }
    .servers { min-width: 0; min-height: 0; height: 100%; overflow-y: auto; overscroll-behavior: contain; flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); align-content: start; grid-auto-rows: max-content; gap: 16px; padding: 28px; }
    .servers[hidden] { display: none; }
    .create-server { aspect-ratio: 3 / 2; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; padding: 16px; border: 1px solid #303030; border-radius: 10px; background: #1b1b1b; color: #ededed; font: inherit; cursor: pointer; }
    .create-server:hover { background: #383838; }
    .create-server:focus-visible { outline: 2px solid #d5d5d5; outline-offset: 2px; }
    .create-server svg { width: 64px; height: 64px; }
    .server-card { position: relative; display: flex; flex-direction: column; overflow: hidden; aspect-ratio: 3 / 2; border: 1px solid #303030; border-radius: 10px; background: #1b1b1b; color: #ededed; }
    .server-open { position: relative; z-index: 1; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: end; width: 100%; padding: 20px 20px 10px; border: 0; background: transparent; color: #ededed; text-align: left; font: inherit; cursor: pointer; }
    .card-footer { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; padding: 0 20px 16px; }
    .card-status { flex: 1; display: flex; align-items: center; gap: 7px; color: #858585; font-size: 12px; }
    .card-status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #858585; }
    .card-status.running { color: #79a887; } .card-status.running::before { background: #79a887; }
    .card-action { padding: 7px 11px; border: 0; border-radius: 5px; color: #111111; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
    .card-start { background: #79a887; } .card-stop { background: #c77979; }
    .card-action:disabled { background: #242424; color: #666666; cursor: default; }
    [hidden] { display: none !important; }
    dialog { width: min(380px, calc(100% - 48px)); padding: 24px; border: 1px solid #303030; border-radius: 8px; background: #1b1b1b; color: #ededed; }
    dialog::backdrop { background: rgba(0,0,0,.7); } dialog p { line-height: 1.5; } dialog a { color: #ededed; }
    .dialog-button { padding: 9px 14px; border: 0; border-radius: 5px; background: #ededed; color: #111111; font: inherit; cursor: pointer; }
    .dialog-cancel { background: #242424; color: #ededed; margin-left: 8px; }
    dialog[open] { animation: card-popup-in 180ms ease-out; }
    @keyframes card-popup-in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { dialog[open] { animation: none; } }
    .server-card::before { content: ''; position: absolute; inset: -10px; background-image: var(--edition-image); background-size: 85% auto; background-position: center; background-repeat: no-repeat; filter: blur(3px); opacity: .55; transition: opacity 160ms ease; }
    .server-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, #111111 0%, transparent 100%); }
    .server-card:hover::before { opacity: .8; }
    .server-card h2, .server-card p { position: relative; z-index: 1; }
    @media (prefers-reduced-motion: reduce) { .server-card::before { transition: none; } }
    .server-card:hover { background: #383838; }
    .server-open:focus-visible, .card-action:focus-visible, .dialog-button:focus-visible { outline: 2px solid #d5d5d5; outline-offset: -2px; }
    .server-card h2 { margin: 0 0 10px; font-size: 16px; }
    .server-card p { margin: 0; color: #888888; font-size: 14px; }
    @keyframes page-enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    main { animation: page-enter 220ms ease-out both; }
    button, a, input, select { transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease; }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } button, a, input, select { transition: none; } }

    /* Motion for page changes and interaction feedback. */
    @keyframes motion-sidebar { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes motion-reveal { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes motion-dialog { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes motion-backdrop { from { opacity: 0; } to { opacity: 1; } }
    .sidebar { animation: motion-sidebar 380ms cubic-bezier(.2,.7,.2,1) both; }
    .sidebar .item, .sidebar .section-label, .sidebar-server { animation: motion-reveal 360ms cubic-bezier(.2,.7,.2,1) backwards; }
    .sidebar > :nth-child(2) { animation-delay: 35ms; }
    .sidebar > :nth-child(3) { animation-delay: 70ms; }
    .sidebar > :nth-child(4) { animation-delay: 105ms; }
    .sidebar > :nth-child(5) { animation-delay: 140ms; }
    .sidebar > :nth-child(6) { animation-delay: 175ms; }
    .sidebar > :nth-child(7) { animation-delay: 210ms; }
    .sidebar > :nth-child(8) { animation-delay: 245ms; }
    main { animation: motion-reveal 380ms cubic-bezier(.2,.7,.2,1) both; }
    button, a, input, select { transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease, box-shadow 200ms ease, transform 200ms cubic-bezier(.2,.7,.2,1), opacity 200ms ease; }
    button:not(:disabled):active { transform: scale(.96); }
    .sidebar .item:hover { transform: translateX(4px); }
    .sidebar .item svg { transition: transform 220ms cubic-bezier(.2,.7,.2,1), color 200ms ease; }
    .sidebar .item:hover svg { transform: scale(1.12); }
    input:focus, select:focus { box-shadow: 0 0 0 3px rgba(213,213,213,.12); }
    dialog[open] { animation: motion-dialog 300ms cubic-bezier(.2,.7,.2,1); }
    dialog[open]::backdrop { animation: motion-backdrop 300ms ease; }
    .panel:not([hidden]) { animation: motion-reveal 320ms cubic-bezier(.2,.7,.2,1); }
    .server-card, .create-server, .software-card, .modpack-card, .monitor-card, .detail-row { animation: motion-reveal 380ms cubic-bezier(.2,.7,.2,1) backwards; transition: transform 220ms cubic-bezier(.2,.7,.2,1), background-color 200ms ease, border-color 200ms ease, box-shadow 200ms ease; }
    .server-card:nth-child(2), .software-card:nth-child(2), .modpack-card:nth-child(2), .monitor-card:nth-child(2), .detail-row:nth-child(2) { animation-delay: 35ms; }
    .server-card:nth-child(3), .software-card:nth-child(3), .modpack-card:nth-child(3), .monitor-card:nth-child(3), .detail-row:nth-child(3) { animation-delay: 70ms; }
    .server-card:nth-child(4), .software-card:nth-child(4), .modpack-card:nth-child(4) { animation-delay: 105ms; }
    .server-card:hover, .create-server:hover, .software-card:hover, .modpack-card:hover { transform: translateY(-3px); border-color: #666666; }
    .create-server svg, .modpack-icon { transition: transform 240ms cubic-bezier(.2,.7,.2,1); }
    .create-server:hover svg { transform: rotate(90deg) scale(1.08); }
    .modpack-card:hover .modpack-icon { transform: scale(1.06); }
    .software-card::before, .server-card::before { transition: opacity 240ms ease, transform 350ms ease; }
    .software-card:hover::before, .server-card:hover::before { transform: scale(1.06); }
    .sidebar-server, .sidebar-server-status, .status, .overview-status, .card-status, .card-status::before { transition: background-color 260ms ease, border-color 260ms ease, color 260ms ease; }
    .version-list:not([hidden]) { animation: motion-reveal 180ms ease-out; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
    @media (max-height: 600px) {
      .sidebar { padding-top: 12px; padding-bottom: 12px; }
      .sidebar .item { padding-top: 6px; padding-bottom: 6px; }
      .section-label { margin-bottom: 4px; }
    }
    @media (max-width: 600px) {
      .sidebar { flex: 0 0 78px; width: 78px; padding: 16px 6px; }
      .section-label { display: none; }
      .sidebar .item { flex-direction: column; justify-content: center; gap: 4px; padding: 9px 2px; font-size: 10px; text-align: center; }
      .sidebar .item:hover { transform: none; }
      .servers { padding: 16px; gap: 12px; }
      .server-card h2 { overflow-wrap: anywhere; }
      .server-open { padding: 14px 14px 8px; }
      .card-footer { padding: 0 14px 12px; }
    }
  </style>
  <link rel="stylesheet" href="/host-status.css">
  <script defer src="/host-status.js"></script>
</head>
<body>
  <header class="host-bar" data-state="loading" aria-label="Host status">
    <div class="host-health"><span class="host-dot" aria-hidden="true"></span><span>Host</span><span data-host-state role="status">Connecting</span></div>
    <div class="host-metrics">
      <div class="host-metric"><span class="host-label">CPU</span><span class="host-value" data-host-cpu>—</span></div>
      <div class="host-metric"><span class="host-label">Memory</span><span class="host-value" data-host-memory>—</span></div>
      <div class="host-metric"><span class="host-label">Disk</span><span class="host-value" data-host-disk>—</span></div>
    </div>
  </header>
  <aside class="sidebar" aria-label="Dashboard menu">
    <div class="section-label">Dashboard</div>
    <button class="item" type="button" id="servers-button" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg><span>Servers</span></button>
    <button class="item" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>Monitor</span></button>

  </main>

    document.getElementById('card-eula-cancel').onclick = () => { pendingEula = null; eulaDialog.close(); };
    async function serverRequest(id, action, body) {
      const response = await fetch('/api/servers/' + encodeURIComponent(id) + (action ? '/' + action : ''), action ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body || {})} : undefined);
      const data = await response.json(); if (!response.ok) throw new Error(data.message || 'Unable to update the server.'); return data;
    }
    async function updateCard(id) {
      try {
        const data = await serverRequest(id); const card = cards.get(id); if (!card) return;
        card.info = data; card.status.textContent = data.running ? 'Running' : 'Stopped'; card.status.classList.toggle('running', data.running);
        card.start.hidden = data.running; card.stop.hidden = !data.running;
      } catch (_) { const card = cards.get(id); if (card) { card.status.textContent = 'Unavailable'; card.status.classList.remove('running'); card.start.hidden = true; card.stop.hidden = true; } }
    }
    async function changeState(id, action) {
      const card = cards.get(id); card.start.disabled = true; card.stop.disabled = true;
      try { await serverRequest(id, action); await updateCard(id); }
      catch (error) { showError(error.message); }
      finally { card.start.disabled = false; card.stop.disabled = false; }
    }
    document.getElementById('card-eula-accept').onclick = async () => {
      const id = pendingEula; pendingEula = null; eulaDialog.close(); if (!id) return;
      try { await serverRequest(id, 'accept-eula', {eulaAccepted:true}); await changeState(id, 'start'); }
      catch (error) { showError(error.message); }
    };
    fetch('/api/servers').then(response => response.json()).then(data => {
      const grid = document.getElementById('servers');
      for (const server of data.servers || []) {
        const card = document.createElement('article'); card.className = 'server-card';
        card.style.setProperty('--edition-image', `url("${editionImages[server.edition] || editionImages.java}")`);
        const open = document.createElement('button'); open.type = 'button'; open.className = 'server-open';
        open.addEventListener('click', () => { window.location.href = '/server/' + encodeURIComponent(server.id); });
        const title = document.createElement('h2'); title.textContent = server.name;
        const info = document.createElement('p'); info.textContent = `${server.edition === 'java' ? 'Java' : 'Bedrock'} · ${server.version_label || server.version}`;
        open.append(title, info);
        const footer = document.createElement('div'); footer.className = 'card-footer';
        const status = document.createElement('span'); status.className = 'card-status'; status.textContent = '…';
        const start = document.createElement('button'); start.type = 'button'; start.className = 'card-action card-start'; start.textContent = 'Start'; start.hidden = true;
        const stop = document.createElement('button'); stop.type = 'button'; stop.className = 'card-action card-stop'; stop.textContent = 'Stop'; stop.hidden = true;
        start.onclick = () => { const state = cards.get(server.id).info; if (state && !state.eulaAccepted) { pendingEula = server.id; eulaDialog.showModal(); } else changeState(server.id, 'start'); };
        stop.onclick = () => changeState(server.id, 'stop');
        footer.append(status, start, stop); card.append(open, footer); cards.set(server.id, {status, start, stop, info:null});
        grid.insertBefore(card, grid.firstElementChild); updateCard(server.id);
      }
    }).catch(() => showError('Unable to load servers.'));
    setInterval(() => { for (const id of cards.keys()) updateCard(id); }, 3000);
    document.getElementById('servers-button').addEventListener('click', () => {
      document.getElementById('servers').hidden = false;
    });
  </script>
</body>
</html>
